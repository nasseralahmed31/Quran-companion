name: Android Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build
        run: |
          gradle assembleDebug testDebugUnitTest --stacktrace --info 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Show Kotlin errors
        if: always()
        run: |
          grep -n -B 5 -A 8 -E 'e: |error:|Compilation error' build.log || true

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: quran-companion-debug-apk
          path: app/build/outputs/apk/debug/*.apk
