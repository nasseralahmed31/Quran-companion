
name: Android Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK and run unit tests
        id: build
        run: |
          gradle assembleDebug testDebugUnitTest --stacktrace --info 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Show Kotlin errors
        if: always()
        run: |
          if [ -f build.log ]; then
            echo "========== KOTLIN ERRORS =========="
            grep -n -B 5 -A 8 -E 'e: |error:|What went wrong|Compilation error' build.log || true
          else
            echo "build.log was not created"
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-error-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: quran-companion-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error


